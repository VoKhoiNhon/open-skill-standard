# Open Skill Standard v0.1 — taxonomy (normative)
version: "0.1"

# Lifecycle phases, in order. Keywords drive target-phase detection in `route`. `keywords` is English, the
# canonical list; other languages go in `keywords_i18n`, one block per BCP 47 language tag (SPEC §3.1).
phases:
  - id: discover
    keywords: [idea, ideas, brainstorm, ideate, "pressure-test", concept, explore, "what if", should we, brainstorming]
    keywords_i18n:
      vi: [ý tưởng, suy nghĩ, phản biện]
  - id: research
    keywords: [research, compare, benchmark, "market research", survey, "literature", investigate, evaluate options]
    keywords_i18n:
      vi: [nghiên cứu, so sánh, tìm hiểu, khảo sát]
  - id: specify
    keywords: [spec, specification, requirements, prd, "user story", "acceptance criteria", "data contract"]
    keywords_i18n:
      vi: [đặc tả, "yêu cầu nghiệp vụ", "tài liệu yêu cầu"]
  - id: plan
    keywords: [plan, design, architecture, adr, roadmap, breakdown, estimate, "task list"]
    keywords_i18n:
      vi: [kế hoạch, thiết kế, kiến trúc, chia việc]
  - id: build
    keywords: [build, implement, create, add, develop, code, write, update, feature, pipeline, endpoint, migrate, refactor, fix, integrate]
    keywords_i18n:
      vi: [xây, làm, thêm, viết, cập nhật, triển khai, tính năng, sửa]
    # Generic verbs count as hits but never break a tie: "write a postmortem" is learn, "write an ADR" is plan.
    # They still beat verify, because tests are code you write ("viết test tự động").
    generic: [write, update]
    generic_i18n:
      vi: [viết, cập nhật]
  - id: verify
    keywords: [test, tests, verify, validate, qa, "e2e", check, reconcile, profiling]
    keywords_i18n:
      vi: [kiểm thử, kiểm tra, đối soát, xác minh]
  - id: review
    keywords: [review, audit, "pull request", pr, "code review", critique]
    keywords_i18n:
      vi: [rà soát, đánh giá code]
  - id: release
    keywords: [release, deploy, ship, publish, rollout, merge]
    keywords_i18n:
      vi: [phát hành, triển khai lên, deploy lên]
  - id: operate
    # Symptoms count too: people report what they see, not that it is a bug. Not bare "regression" (a model type).
    keywords: [incident, outage, alert, monitor, "on-call", debug, error, failing, broken, crash, crashes, hangs, slow, cost,
               slower, regressed, "performance regression", timeout, "timed out", "times out", "stopped working",
               "not working", "doesn't work", "returns nothing", "since yesterday"]
    keywords_i18n:
      vi: [sự cố, lỗi, treo, văng, giám sát, chậm, chi phí, "không chạy", "không hoạt động", "ngừng hoạt động",
           "không trả về", "từ hôm qua"]
    # Symptoms say something is wrong now, so they win keyword ties against build and release nouns
    # ("the deploy pipeline is failing"). Topic words do not: alert, monitor, cost, and error and lỗi,
    # which just as often name a topic ("add error handling", "lỗi chính tả" is a typo).
    symptoms: [debug, failing, broken, crash, crashes, hangs]
    symptoms_i18n:
      vi: [treo, văng]
  - id: learn
    keywords: [retro, retrospective, postmortem, "lessons learned", remember, "note that"]
    keywords_i18n:
      vi: [bài học, rút kinh nghiệm, ghi nhớ]

# Artifact types and the repository globs that reveal them.
artifacts:
  idea-brief: ["**/idea-brief*.md", "**/brief*.md"]
  research-report: ["**/research*.md", "docs/research/**"]
  prd: ["**/prd.md", "**/PRD.md", "**/prd-*.md", "**/prds/*.md"]
  spec: ["specs/*/spec.md", "**/SPEC.md", "**/spec.md", "docs/**/specs/*.md"]
  plan: ["specs/*/plan.md", "**/plans/*.md", "**/PLAN.md", "**/plan.md"]
  tasks: ["specs/*/tasks.md", "**/tasks.md"]
  adr: ["docs/adr/*.md", "**/adr/*.md", "**/decisions/*.md"]
  ux-design: ["**/DESIGN.md", "**/EXPERIENCE.md", "**/ux*.md"]
  code-change: []
  test-suite: ["tests/**", "test/**", "**/*_test.*", "**/*.test.*", "**/*.spec.*"]
  data-profile: ["**/data-profile*.md", "**/profiling/**"]
  data-contract: ["**/datacontract*.yaml", "**/*.odcs.yaml", "**/contracts/*.yaml"]
  pipeline: ["dbt_project.yml", "**/dags/**", "databricks.yml", "**/pipelines/**"]
  analysis-report: ["**/analysis*.md", "**/reports/**"]
  dashboard: ["**/dashboards/**"]
  model-card: ["**/model-card*.md", "**/MODEL_CARD.md"]
  eval-suite: ["evals/**", "**/evals/**"]
  runbook: ["**/runbook*.md", "**/runbooks/**"]
  retro: ["**/retro*.md", "**/postmortem*.md"]

edges: [produces, consumes, precedes, alternative-to, conflicts-with, requires, applies-to, recommends]

task_sizes: [small, medium, large]

# Keywords that hint at task size (used when --size is not given); other languages in size_keywords_i18n.
size_keywords:
  large: [app, application, system, platform, product, "new project", "from scratch", greenfield, mvp]
  small: [typo, rename, "one-line", "one line", small, tiny, quick, minor, bump]
size_keywords_i18n:
  vi:
    large: [ứng dụng, hệ thống, nền tảng, dự án mới, từ đầu]
    small: [lỗi chính tả, đổi tên, nhỏ, nhanh]

# Words search ignores in a request; other languages in stopwords_i18n.
stopwords: [a, an, the, to, of, in, "on", for, and, or, not, is, it, this, that, these, those, with, be, are, was, as, at,
            by, from, into, my, our, your, we, i, you, me, us, please, can, could, should, would, will, how, what, why,
            when, where, which, who, do, does, did, make, get, use, using, need, want, just, also, some, any, all, new, one]
stopwords_i18n:
  vi: [và, của, cho, là, có, các, những, một, này, đó, với, được, trong, không, thì, mà, để, khi, như, nào, gì, bị]

role_families:
  engineering: [frontend-developer, backend-developer, fullstack-developer, mobile-developer, embedded-engineer, game-developer]
  quality-ops: [qa-engineer, devops-engineer, site-reliability-engineer, cloud-engineer, security-engineer, database-administrator, system-administrator]
  data-ai: [data-engineer, analytics-engineer, data-analyst, data-scientist, ml-engineer, ai-engineer, data-ai-platform-engineer]
  architecture-leadership: [software-architect, tech-lead, engineering-manager]
  product-delivery: [product-manager, business-analyst, ux-designer, technical-writer, scrum-master]

# Project markers of frameworks that own the build workflow; earlier entries win.
native_markers:
  - {framework: spec-kit, paths: [".specify"]}
  - {framework: bmad-method, paths: ["_bmad"]}

tool_markers:
  codegraph: [".codegraph"]
  graphify: ["graphify-out"]

knowledge_types: [preference, lesson, glossary, project-fact, pitfall]
