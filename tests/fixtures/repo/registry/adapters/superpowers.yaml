source: superpowers
upstream: https://github.com/obra/superpowers
license: MIT
install: {skills-cli: "npx skills add obra/superpowers -g"}
detect:
  - {glob: "~/.claude/plugins/cache/*/superpowers/*/skills/{name}/SKILL.md", invoke: "superpowers:{name}"}
  - {glob: "~/.claude/skills/{name}/SKILL.md", invoke: "{name}"}
portability: [claude-code, codex]
skills:
  - name: brainstorming
    description: Turn ideas into an approved design before building
    phases: [discover, plan]
    roles: {fullstack-developer: 0.9}
    produces: [spec]
    task_size: [medium, large]
  - name: writing-plans
    description: Write a detailed implementation plan from a spec
    phases: [plan]
    roles: {fullstack-developer: 1.0, data-engineer: 0.8}
    consumes: [spec]
    produces: [plan]
    task_size: [medium, large]
  - name: subagent-driven-development
    description: Execute a plan task by task with subagents and review
    phases: [build]
    roles: {fullstack-developer: 1.0, data-engineer: 0.8}
    consumes: [plan]
    produces: [code-change]
    conflicts: [spec-kit/implement]
    task_size: [medium, large]
  - name: test-driven-development
    description: Write the failing test first, then the code
    phases: [build, verify]
    roles: {fullstack-developer: 1.0, data-engineer: 0.7}
    produces: [test-suite]
    triggers: [tdd, "test first", "unit test"]
    task_size: [small, medium, large]
