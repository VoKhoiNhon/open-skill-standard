<rect x="330" y="218" width="295.9" height="24" rx="3" class="blue"/>
<line x1="552.75" y1="230.0" x2="696.85" y2="230.0" class="edge"/>
<line x1="552.75" y1="224" x2="552.75" y2="236" class="edge"/>
<line x1="696.85" y1="224" x2="696.85" y2="236" class="edge"/>
<text x="706.85" y="234" class="s">54%  [40%–67%]  28/52</text>
<text x="24" y="276" class="b">Open Skill router</text>
<rect x="330" y="260" width="370.15" height="24" rx="3" class="green"/>
<line x1="625.9" y1="272.0" x2="761.75" y2="272.0" class="edge"/>
<line x1="625.9" y1="266" x2="625.9" y2="278" class="edge"/>
<line x1="761.75" y1="266" x2="761.75" y2="278" class="edge"/>
<text x="771.75" y="276" class="b t-green">67%  [54%–78%]  35/52</text>
<text x="24" y="336" class="m s">Router vs description match on the same 52 cases: 29 wins, 3 losses, exact McNemar p = 3×10⁻⁶. Whiskers: 95% Wilson intervals.</text>
<text x="24" y="356" class="m s">Limits: labels written by the maintainer, few cases (wide intervals); this measures routing, not the work after it. Regenerate: uv run python -m open_skill.benchmark</text>
