<text x="503.35" y="108" class="s">17%  [9%–30%]  9/52</text>
<text x="24" y="150">Random skill in the router's phases</text>
<rect x="330" y="134" width="274.45" height="24" rx="3" class="box"/>
<text x="614.45" y="150" class="s">50% expected over 200 draws</text>
<text x="24" y="192">Router without phase detection</text>
<rect x="330" y="176" width="179.85" height="24" rx="3" class="blue"/>
<line x1="448.25" y1="188.0" x2="584.1" y2="188.0" class="edge"/>
<line x1="448.25" y1="182" x2="448.25" y2="194" class="edge"/>
<line x1="584.1" y1="182" x2="584.1" y2="194" class="edge"/>
<text x="594.1" y="192" class="s">33%  [22%–46%]  17/52</text>
