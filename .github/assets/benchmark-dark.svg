<text x="605" y="76" class="m s" text-anchor="middle">50%</text>
<line x1="742.5" y1="82" x2="742.5" y2="310" class="dash"/>
<text x="742.5" y="76" class="m s" text-anchor="middle">75%</text>
<line x1="880" y1="82" x2="880" y2="310" class="dash"/>
<text x="880" y="76" class="m s" text-anchor="middle">100%</text>
<text x="24" y="108">Description match only (BM25, top-1)</text>
<rect x="330" y="92" width="95.15" height="24" rx="3" class="box"/>
