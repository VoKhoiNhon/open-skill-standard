<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Held-out routing benchmark: 52 requests never tuned on. Description match only (BM25, top-1) 17%; Random skill in the router's phases 50%; Router without phase detection 33%; Router without role priors 54%; Open Skill router 67%">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:13px;fill:#e6edf3}.m{fill:#9198a1}.b{font-weight:600}.s{font-size:11.5px}.h{font-size:15px;font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:12px}.box{fill:#151b23;stroke:#3d444d;stroke-width:1}.dash{fill:none;stroke:#3d444d;stroke-width:1;stroke-dasharray:4 3}.edge{fill:none;stroke:#9198a1;stroke-width:1.4}.blue{fill:#0f2542;stroke:#4493f8;stroke-width:1.2}.t-blue{fill:#4493f8}.e-blue{fill:none;stroke:#4493f8}#arrow-blue path{fill:#4493f8}.green{fill:#11281a;stroke:#3fb950;stroke-width:1.2}.t-green{fill:#3fb950}.e-green{fill:none;stroke:#3fb950}#arrow-green path{fill:#3fb950}.orange{fill:#2e1c10;stroke:#db6d28;stroke-width:1.2}.t-orange{fill:#db6d28}.e-orange{fill:none;stroke:#db6d28}#arrow-orange path{fill:#db6d28}.purple{fill:#241a38;stroke:#ab7df8;stroke-width:1.2}.t-purple{fill:#ab7df8}.e-purple{fill:none;stroke:#ab7df8}#arrow-purple path{fill:#ab7df8}.red{fill:#3a1716;stroke:#f85149;stroke-width:1.2}.t-red{fill:#f85149}.e-red{fill:none;stroke:#f85149}#arrow-red path{fill:#f85149}#arrow path{fill:#9198a1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<text x="24" y="34" class="h">Routing benchmark · 52 held-out requests, never tuned on</text>
<text x="24" y="56" class="m s">A case passes only if every labeled check holds. Paraphrased, messy, English and Vietnamese (with and without accents).</text>
<line x1="330" y1="82" x2="330" y2="310" class="dash"/>
<text x="330" y="76" class="m s" text-anchor="middle">0%</text>
