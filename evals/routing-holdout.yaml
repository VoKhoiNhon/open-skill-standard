# Held-out routing evals: paraphrased, messy requests as people actually type them, in English and Vietnamese
# with and without accents. Same format as routing.yaml (see its header).
#
# DO NOT TUNE AGAINST THESE CASES ONE BY ONE. They measure whether routing generalizes beyond the cases the
# weights and keywords were tuned on. Do not add keywords, weights or role-pack entries to make a single case
# pass, and do not edit a case's labels to match what the router does. Improve routing using routing.yaml and
# your own examples, then read the holdout score to see whether the change generalized. CI only enforces a floor
# just below the measured score (tests/test_evals.py), so a drop fails but a single case never becomes a target.
#
# Labels say what a good router should do, not what this one does today; several cases fail by design.
