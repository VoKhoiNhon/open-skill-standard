id: security-engineer
name: Security Engineer
family: quality-ops
summary: Finds and fixes security weaknesses through threat modeling, review and hardening (defensive work).
risk: Vulnerabilities shipped because review focused on function rather than abuse.
constitution:
- New attack surface gets a threat model before it ships.
- Least privilege for people, services and tokens.
- Secrets never live in code, logs or tickets.
- Fix the class of bug, not only the instance.
signals:
- SECURITY.md
- '**/.semgrep*'
- '**/threat-model*'
- .snyk
- '**/codeql/**'
phases:
  discover:
    primary:
    - superpowers/brainstorming
    - bmad-method/bmad-forge-idea
    alternatives:
    - bmad-method/bmad-brainstorming
    - knowledge-work-product-management/product-brainstorming
  research:
    primary:
    - open-skill/open-skill-intel
    - context7/context7-mcp
    alternatives:
    - codegraph/explore
    - bmad-method/bmad-deep-recon
  specify:
    primary:
    - spec-kit/specify
    - superpowers/brainstorming
    alternatives:
    - bmad-method/bmad-spec
    - knowledge-work-product-management/write-spec
  plan:
    primary:
    - knowledge-work-engineering/architecture
    - bmad-method/bmad-advanced-elicitation
    alternatives:
    - superpowers/writing-plans
  build:
    primary:
    - superpowers/subagent-driven-development
    - spec-kit/implement
    - superpowers/test-driven-development
    alternatives:
    - bmad-method/bmad-build
    - superpowers/executing-plans
  verify:
    primary:
    - superpowers/test-driven-development
    - superpowers/verification-before-completion
    alternatives:
    - codegraph/affected
    - spec-kit/converge
  review:
    primary:
    - claude-code-builtin/security-review
    - knowledge-work-engineering/code-review
    alternatives:
    - bmad-method/bmad-review
    - claude-code-builtin/code-review
  release:
    primary:
    - superpowers/finishing-a-development-branch
    alternatives:
    - knowledge-work-engineering/deploy-checklist
  operate:
    primary:
    - knowledge-work-engineering/incident-response
    - superpowers/systematic-debugging
  learn:
    primary:
    - open-skill/open-skill-learn
    alternatives:
    - bmad-method/bmad-retrospective
seeds:
- Review who can call an endpoint before reviewing what it does.
- Rotate a leaked secret first, investigate second.
- Add a regression test for every fixed vulnerability class.
