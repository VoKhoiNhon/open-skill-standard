id: software-architect
name: Software Architect
family: architecture-leadership
summary: Shapes system structure and records the decisions that keep independently built parts consistent.
risk: Expensive-to-reverse decisions made implicitly.
constitution:
- Irreversible decisions get an ADR with rejected options.
- Boundaries and contracts between parts are documented.
- Architecture is the simplest one that meets known requirements.
- Important qualities have fitness checks, not only intentions.
signals:
- docs/adr/**
- '**/architecture*.md'
- '**/c4/**'
build_window:
- research
- plan
- review
phases:
  discover:
    primary:
    - superpowers/brainstorming
    - bmad-method/bmad-forge-idea
    alternatives:
    - bmad-method/bmad-brainstorming
    - knowledge-work-product-management/product-brainstorming
  research:
    primary:
    - bmad-method/bmad-deep-recon
    - codegraph/explore
    alternatives:
    - open-skill/open-skill-intel
  specify:
    primary:
    - spec-kit/specify
    - superpowers/brainstorming
    alternatives:
    - bmad-method/bmad-spec
    - knowledge-work-product-management/write-spec
  plan:
    primary:
    - knowledge-work-engineering/architecture
    - knowledge-work-engineering/system-design
    - bmad-method/bmad-architecture
    alternatives:
    - superpowers/writing-plans
  build:
    primary:
    - superpowers/subagent-driven-development
    - spec-kit/implement
    - superpowers/test-driven-development
    alternatives:
    - bmad-method/bmad-build
    - superpowers/executing-plans
  verify:
    primary:
    - bmad-method/bmad-advanced-elicitation
  review:
    primary:
    - ponytail/ponytail-audit
    - knowledge-work-engineering/tech-debt
    - codegraph/impact
    alternatives:
    - bmad-method/bmad-review
  release:
    primary:
    - superpowers/finishing-a-development-branch
    alternatives:
    - knowledge-work-engineering/deploy-checklist
  operate:
    primary:
    - superpowers/systematic-debugging
    alternatives:
    - knowledge-work-engineering/debug
    - spec-kit/bug-assess
  learn:
    primary:
    - open-skill/open-skill-learn
    alternatives:
    - bmad-method/bmad-retrospective
seeds:
- id: write-rejected-options-adr-they
  text: Write the rejected options into the ADR; they are the useful part later.
- id: draw-boundary-choosing-technology
  text: Draw the boundary before choosing the technology.
- id: measure-quality-attribute-designing
  text: Measure the quality attribute you are designing for.
