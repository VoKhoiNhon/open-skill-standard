id: devops-engineer
name: DevOps Engineer
family: quality-ops
summary: Builds and runs CI/CD, environments and developer tooling.
risk: A pipeline or infrastructure change that breaks every team's deploys.
constitution:
- Everything is code and changes through pull requests.
- Every change has a tested rollback path.
- Secrets live in a secret manager, never in code or CI logs.
- Pipelines are fast, cached and reproducible.
signals:
- .github/workflows/**
- .gitlab-ci.yml
- Jenkinsfile
- Dockerfile
- '**/*.tf'
- helm/**
- k8s/**
phases:
  discover:
    primary:
    - superpowers/brainstorming
    - bmad-method/bmad-forge-idea
    alternatives:
    - bmad-method/bmad-brainstorming
    - knowledge-work-product-management/product-brainstorming
  research:
    primary:
    - open-skill/open-skill-intel
    - context7/context7-mcp
    alternatives:
    - codegraph/explore
    - bmad-method/bmad-deep-recon
  specify:
    primary:
    - spec-kit/specify
    - superpowers/brainstorming
    alternatives:
    - bmad-method/bmad-spec
    - knowledge-work-product-management/write-spec
  plan:
    primary:
    - superpowers/writing-plans
    - knowledge-work-engineering/architecture
    alternatives:
    - spec-kit/plan
  build:
    primary:
    - superpowers/subagent-driven-development
    - spec-kit/implement
    alternatives:
    - bmad-method/bmad-build
    - ponytail/ponytail
  verify:
    primary:
    - superpowers/test-driven-development
    - superpowers/verification-before-completion
    alternatives:
    - codegraph/affected
    - spec-kit/converge
  review:
    primary:
    - claude-code-builtin/security-review
    - claude-code-builtin/code-review
    - codegraph/impact
    alternatives:
    - ponytail/ponytail-review
  release:
    primary:
    - knowledge-work-engineering/deploy-checklist
    - superpowers/finishing-a-development-branch
  operate:
    primary:
    - knowledge-work-engineering/incident-response
    - superpowers/systematic-debugging
    alternatives:
    - claude-code-builtin/update-config
  learn:
    primary:
    - open-skill/open-skill-learn
    alternatives:
    - bmad-method/bmad-retrospective
seeds:
- Pin action and image versions; float nothing in CI.
- Keep deploy and rollback as the same command with a different version.
- Fail the pipeline on a secret found in the diff.
