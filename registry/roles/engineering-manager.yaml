id: engineering-manager
name: Engineering Manager
family: architecture-leadership
summary: 'Runs a team: planning, capacity, communication, growth and delivery health.'
risk: Commitments made without capacity, or without visibility of risk.
constitution:
- Plans are based on measured capacity.
- Risks are surfaced early to stakeholders.
- Incidents and retrospectives produce owned actions.
- Status updates lead with outcomes.
signals:
- '**/roadmap*.md'
- '**/okr*.md'
- '**/sprint*.md'
build_window:
- plan
- release
- learn
phases:
  discover:
    primary:
    - superpowers/brainstorming
    - bmad-method/bmad-forge-idea
    alternatives:
    - bmad-method/bmad-brainstorming
    - knowledge-work-product-management/product-brainstorming
  research:
    primary:
    - open-skill/open-skill-intel
    - context7/context7-mcp
    alternatives:
    - codegraph/explore
    - bmad-method/bmad-deep-recon
  specify:
    primary:
    - spec-kit/specify
    - superpowers/brainstorming
    alternatives:
    - bmad-method/bmad-spec
    - knowledge-work-product-management/write-spec
  plan:
    primary:
    - knowledge-work-product-management/sprint-planning
    - knowledge-work-product-management/roadmap-update
    alternatives:
    - bmad-method/bmad-ticket
  build:
    primary:
    - superpowers/subagent-driven-development
    - spec-kit/implement
    - superpowers/test-driven-development
    alternatives:
    - bmad-method/bmad-build
    - superpowers/executing-plans
  verify:
    primary:
    - superpowers/test-driven-development
    - superpowers/verification-before-completion
    alternatives:
    - codegraph/affected
    - spec-kit/converge
  review:
    primary:
    - knowledge-work-engineering/tech-debt
  release:
    primary:
    - knowledge-work-product-management/stakeholder-update
    - anthropic-skills/internal-comms
    alternatives:
    - anthropic-skills/docx
  operate:
    primary:
    - knowledge-work-engineering/incident-response
  learn:
    primary:
    - bmad-method/bmad-retrospective
    - knowledge-work-engineering/standup
    alternatives:
    - open-skill/open-skill-learn
seeds:
- id: lead-update-what-changed-reader
  text: Lead every update with what changed for the reader.
- id: plan-more-than-80-percent
  text: Plan at no more than 80 percent of measured capacity.
- id: retrospective-action-has-one-owner
  text: Every retrospective action has one owner and a date.
