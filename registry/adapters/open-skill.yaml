source: open-skill
upstream: https://github.com/VoKhoiNhon/open-skill-standard
license: MIT
tested_version: 0.7.5
summary: Core skills of the Open Skill Standard - router, standards, intel, learn.
install:
  claude-plugin: "/plugin marketplace add VoKhoiNhon/open-skill-standard && /plugin install open-skill@open-skill-standard"
  skills-cli: "npx skills add VoKhoiNhon/open-skill-standard -g"
detect:
  - {glob: "~/.claude/plugins/cache/*/open-skill/*/skills/{name}/SKILL.md", invoke: "open-skill:{name}"}
  - {glob: "{skills}/{name}/SKILL.md", invoke: "{name}"}
  - {glob: "{project_skills}/{name}/SKILL.md", invoke: "{name}"}
portability: [claude-code, codex, cursor, copilot, gemini]
skills:
  - name: open-skill-router
    kind: meta
    description: Pick and order the right installed skills for a task in any project and role
    phases: [discover]
    task_size: [medium, large]
    triggers_i18n: {vi: [bắt đầu, quy trình, dùng skill]}
  - name: open-skill-standards
    description: Definition-of-done checklists, general and per role
    phases: [verify, review]
    task_size: [small, medium, large]
    triggers: [standards, checklist, "definition of done", "best practice"]
    triggers_i18n: {vi: [quy chuẩn, tiêu chuẩn, đủ chuẩn]}
  - name: open-skill-intel
    description: Route a question to the best information source before acting
    phases: [research]
    task_size: [small, medium, large]
    triggers: ["how does", "where is", "what is", schema, docs, "which skill"]
    triggers_i18n: {vi: [tra cứu, ở đâu, chỗ nào, file nào, định nghĩa, được gọi, ảnh hưởng, nếu sửa]}
  - name: open-skill-learn
    description: Remember lessons and preferences so future routes use them
    phases: [learn]
    task_size: [small, medium, large]
    triggers: [remember, lesson, "note that", "from now on"]
    triggers_i18n: {vi: [ghi nhớ, nhớ giúp, bài học, từ giờ, lần sau]}
