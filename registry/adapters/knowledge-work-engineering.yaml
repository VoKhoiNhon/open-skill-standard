source: knowledge-work-engineering
upstream: https://github.com/anthropics/knowledge-work-plugins/tree/main/engineering
license: Apache-2.0
summary: Engineering workflows - ADRs, system design, code review, debugging, incidents, deploy checklists, docs, tech debt, test strategy.
install:
  claude-plugin: "claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install engineering@knowledge-work-plugins"
detect:
  - {glob: "~/.claude/plugins/cache/*/engineering/*/skills/{name}/SKILL.md", invoke: "engineering:{name}"}
  - {glob: "~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/rpm/*/skills/{name}/SKILL.md", invoke: "engineering:{name}"}
portability: [claude-code, claude-desktop]
skills:
  - name: architecture
    description: Create or evaluate an architecture decision record
    phases: [plan]
    roles: {software-architect: 1.0, tech-lead: 0.9, backend-developer: 0.7, data-ai-platform-engineer: 0.8, cloud-engineer: 0.7}
    produces: [adr]
    task_size: [medium, large]
    triggers: [adr, "architecture decision", "choose between", kiến trúc]
  - name: system-design
    description: Design systems, services and architectures
    phases: [plan]
    roles: {software-architect: 1.0, backend-developer: 0.9, tech-lead: 0.9, cloud-engineer: 0.8, site-reliability-engineer: 0.6}
    produces: [adr, plan]
    task_size: [large]
    triggers: ["system design", "how should we architect", scalability, service]
  - name: code-review
    description: Review changes for security, performance and correctness
    phases: [review]
    roles: {tech-lead: 1.0, backend-developer: 0.8, frontend-developer: 0.8, security-engineer: 0.7}
    task_size: [small, medium, large]
    triggers: ["code review", "review this", pr, diff]
  - name: debug
    description: Structured debugging - reproduce, isolate, diagnose, fix
    phases: [operate]
    alternatives: [superpowers/systematic-debugging]
    task_size: [small, medium, large]
    triggers: [error, "stack trace", bug, crash]
  - name: incident-response
    description: Triage, communicate and write the postmortem for an incident
    phases: [operate, learn]
    roles: {site-reliability-engineer: 1.0, devops-engineer: 0.9, system-administrator: 0.8, engineering-manager: 0.6, database-administrator: 0.6}
    produces: [runbook, retro]
    task_size: [medium, large]
    triggers: [incident, outage, "on-call", postmortem, sự cố]
  - name: deploy-checklist
    description: Pre-deployment verification for releases, migrations and flags
    phases: [release]
    roles: {devops-engineer: 1.0, site-reliability-engineer: 0.9, backend-developer: 0.7, database-administrator: 0.7}
    task_size: [small, medium, large]
    triggers: [deploy, release, rollout, migration, "ship it"]
  - name: documentation
    description: Write and maintain technical documentation and READMEs
    phases: [release]
    roles: {technical-writer: 1.0, tech-lead: 0.6}
    task_size: [small, medium, large]
    triggers: [docs, readme, documentation, "document this", tài liệu]
  - name: standup
    description: Standup update from recent activity
    phases: [learn]
    roles: {scrum-master: 0.8, engineering-manager: 0.7}
    task_size: [small, medium]
  - name: tech-debt
    description: Identify, categorize and prioritize technical debt
    phases: [review, plan]
    roles: {tech-lead: 1.0, engineering-manager: 0.8, software-architect: 0.8}
    task_size: [medium, large]
    triggers: ["tech debt", refactor, cleanup, "nợ kỹ thuật"]
  - name: testing-strategy
    description: Design test strategies and test plans
    phases: [plan, verify]
    roles: {qa-engineer: 1.0, tech-lead: 0.7}
    produces: [plan]
    task_size: [medium, large]
    triggers: ["test strategy", "test plan", coverage, "how should we test"]
