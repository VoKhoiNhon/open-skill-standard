source: knowledge-work-product-management
upstream: https://github.com/anthropics/knowledge-work-plugins/tree/main/product-management
license: Apache-2.0
summary: Product management - specs, roadmaps, sprints, stakeholder updates, research synthesis, metrics.
install:
  claude-plugin: "claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install product-management@knowledge-work-plugins"
detect:
  - {glob: "~/.claude/plugins/cache/*/product-management/*/skills/{name}/SKILL.md", invoke: "product-management:{name}"}
  - {glob: "~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/rpm/*/skills/{name}/SKILL.md", invoke: "product-management:{name}"}
portability: [claude-code, claude-desktop]
skills:
  - name: write-spec
    description: Feature spec or PRD from a problem statement or idea
    phases: [specify]
    roles: {product-manager: 1.0, business-analyst: 0.9, tech-lead: 0.5}
    produces: [spec, prd]
    task_size: [medium, large]
    triggers: [spec, prd, requirements, "user story"]
    triggers_i18n: {vi: [đặc tả]}
  - name: product-brainstorming
    description: Explore problem spaces and challenge assumptions as a thinking partner
    phases: [discover]
    roles: {product-manager: 1.0, ux-designer: 0.7, business-analyst: 0.7}
    produces: [idea-brief]
    task_size: [small, medium, large]
    triggers: [idea, brainstorm, "problem space"]
    triggers_i18n: {vi: [ý tưởng]}
  - name: competitive-brief
    description: Competitive analysis for a feature area or competitors
    phases: [research]
    roles: {product-manager: 1.0, business-analyst: 0.8}
    produces: [research-report]
    task_size: [medium, large]
    triggers: [competitor, competitive, "market"]
    triggers_i18n: {vi: [đối thủ]}
  - name: synthesize-research
    description: Turn interviews, surveys and feedback into structured insights
    phases: [research]
    roles: {product-manager: 0.9, ux-designer: 0.9, business-analyst: 0.8}
    produces: [research-report]
    task_size: [medium, large]
  - name: roadmap-update
    description: Create, update or reprioritize the roadmap
    phases: [plan]
    roles: {product-manager: 1.0, engineering-manager: 0.6}
    task_size: [medium, large]
    triggers: [roadmap, prioritize]
    triggers_i18n: {vi: [lộ trình]}
  - name: sprint-planning
    description: Scope work, estimate capacity and draft a sprint plan
    phases: [plan]
    roles: {scrum-master: 1.0, product-manager: 0.8, engineering-manager: 0.8, tech-lead: 0.7}
    produces: [tasks]
    task_size: [medium, large]
    triggers: [sprint, capacity, estimate, backlog]
  - name: stakeholder-update
    description: Status update tailored to audience and cadence
    phases: [release]
    roles: {product-manager: 1.0, engineering-manager: 0.9, scrum-master: 0.7}
    task_size: [small, medium]
    triggers: ["status update", stakeholder, "weekly update"]
    triggers_i18n: {vi: [báo cáo]}
  - name: metrics-review
    description: Review product metrics with trends and actionable insights
    phases: [verify, learn]
    roles: {product-manager: 1.0, data-analyst: 0.7}
    produces: [analysis-report]
    task_size: [small, medium]
