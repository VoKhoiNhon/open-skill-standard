source: claude-code-builtin
upstream: https://code.claude.com/docs
license: proprietary
summary: Skills bundled with Claude Code itself; available whenever the agent runs inside Claude Code.
available_env: CLAUDECODE
portability: [claude-code]
skills:
  - name: code-review
    description: Review the current diff or a PR for correctness bugs
    phases: [review]
    task_size: [small, medium, large]
    triggers: ["code review", "review this", diff, pr]
  - name: security-review
    description: Security review of pending changes
    phases: [review]
    roles: {security-engineer: 1.0, backend-developer: 0.8, devops-engineer: 0.7, cloud-engineer: 0.7, ai-engineer: 0.8}
    task_size: [small, medium, large]
    triggers: [security, auth, secrets, injection, vulnerability]
    triggers_i18n: {vi: [bảo mật]}
  - name: simplify
    description: Clean up changed code for reuse, simplicity and efficiency
    phases: [review]
    task_size: [small, medium]
  - name: run
    description: Launch and drive the project's app to see a change working
    phases: [verify]
    roles: {frontend-developer: 1.0, fullstack-developer: 1.0, mobile-developer: 0.9, game-developer: 0.9, backend-developer: 0.8}
    task_size: [small, medium, large]
    triggers: [run, start, screenshot, "does it work"]
    triggers_i18n: {vi: [chạy thử]}
  - name: init
    description: Create a CLAUDE.md describing the codebase
    phases: [learn]
    task_size: [small]
  - name: claude-api
    description: Claude API and SDK reference - models, pricing, tool use, caching, migration
    phases: [research, build]
    roles: {ai-engineer: 1.0}
    alternatives: [anthropic-skills/claude-api]
    task_size: [small, medium, large]
    triggers: [claude, anthropic, llm, model, pricing, "prompt caching"]
  - name: update-config
    description: Configure Claude Code settings, hooks and permissions
    phases: [build, operate]
    roles: {data-ai-platform-engineer: 1.0, devops-engineer: 0.6}
    task_size: [small]
    triggers: [hook, permissions, settings.json, config]
  - name: fewer-permission-prompts
    description: Build a read-only allowlist from past sessions
    phases: [operate]
    roles: {data-ai-platform-engineer: 0.8}
    task_size: [small]
  - name: schedule
    description: Scheduled cloud agents on a cron
    phases: [operate]
    roles: {data-analyst: 0.7, site-reliability-engineer: 0.6, data-engineer: 0.6}
    task_size: [small, medium]
    triggers: [schedule, cron, "every day", "every week"]
    triggers_i18n: {vi: [định kỳ]}
  - name: loop
    description: Run a prompt or command on a recurring interval
    phases: [operate]
    task_size: [small]
