id: gemini-cli
name: Gemini CLI
docs: https://geminicli.com/docs/cli/skills/
global:
  - {path: "~/.gemini/skills", source: "https://geminicli.com/docs/cli/skills/"}
  - {path: "~/.agents/skills", source: "https://geminicli.com/docs/cli/skills/"}
project:
  - {path: ".agents/skills", source: "https://geminicli.com/docs/cli/skills/"}
  - {path: ".gemini/skills", source: "https://geminicli.com/docs/cli/skills/"}
detect:
  - {path: "~/.gemini", source: "https://github.com/vercel-labs/skills/blob/3694740352eeef5cdd689af694c485f1ff62eec3/src/agents.ts#L366"}
notes: The model activates skills itself; /skills lists, enables and disables them. Within a tier .agents/skills wins over .gemini/skills.
