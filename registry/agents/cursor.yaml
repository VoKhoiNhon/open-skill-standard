  - {path: ".cursor/skills", source: "https://cursor.com/docs/context/skills"}
  - {path: ".claude/skills", source: "https://cursor.com/docs/context/skills"}
  - {path: ".codex/skills", source: "https://cursor.com/docs/context/skills"}
detect:
