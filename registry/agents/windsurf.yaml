id: windsurf
name: Windsurf
docs: https://docs.devin.ai/desktop/cascade/skills
global:
  - {path: "~/.config/devin/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
  - {path: "~/.codeium/windsurf/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
  - {path: "~/.agents/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
  - {path: "/etc/devin/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
project:
  - {path: ".devin/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
  - {path: ".windsurf/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
  - {path: ".agents/skills", source: "https://docs.devin.ai/desktop/cascade/skills"}
detect:
  - {path: "~/.codeium/windsurf", source: "https://github.com/vercel-labs/skills/blob/3694740352eeef5cdd689af694c485f1ff62eec3/src/agents.ts#L734"}
notes: Invoked as @skill-name. The Windsurf docs now live under Devin Desktop, which prefers .devin/skills and ~/.config/devin/skills (shared with the Devin CLI), so open-skill installs there; the Windsurf folders are still read. /etc/devin/skills holds skills an administrator installs on Linux (Devin Desktop falls back to /etc/windsurf/skills only when it is missing). It also reads .agents/skills, and Claude Code's skill folders only when reading Claude Code config is turned on, so scan does not count those for Windsurf.
