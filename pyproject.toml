[project]
name = "open-skill-standard"
version = "0.6.0"
description = "Open, agent-agnostic standard and router for Agent Skills across IT roles"
readme = "README.md"
license = "MIT"
authors = [{ name = "Võ Khôi Nhơn" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4"]
keywords = ["agent-skills", "claude-code", "skills", "llm", "developer-tools", "spec-driven-development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.scripts]
open-skill = "open_skill.cli:main"

[project.urls]
Homepage = "https://github.com/VoKhoiNhon/open-skill-standard"
Changelog = "https://github.com/VoKhoiNhon/open-skill-standard/blob/main/CHANGELOG.md"
Issues = "https://github.com/VoKhoiNhon/open-skill-standard/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["cli"]

[tool.hatch.build.targets.wheel]
packages = ["cli/open_skill"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "open_skill/_data/registry"
"spec" = "open_skill/_data/spec"
"skills" = "open_skill/_data/skills"
"evals" = "open_skill/_data/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cli"]
